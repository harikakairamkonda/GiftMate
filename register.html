
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GiftMate | User Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f5, #fff4e8);
            color: #392936;
        }

        .register-box {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: white;
            border: 1px solid #f2dce6;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(100, 35, 70, 0.12);
        }

        .logo {
            margin-bottom: 8px;
            color: #bd3472;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #786875;
            text-align: center;
            line-height: 1.6;
        }

        h2 {
            margin-bottom: 10px;
            color: #702449;
            text-align: center;
        }

        .intro {
            margin-bottom: 25px;
            color: #786875;
            font-size: 14px;
            text-align: center;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            color: #492e40;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e5d3dd;
            border-radius: 10px;
            outline: none;
            background: #fffdfd;
            font-size: 15px;
        }

        input:focus {
            border-color: #bd3472;
            box-shadow: 0 0 0 3px #bd34721a;
        }

        .register-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #d94283, #ad2869);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            opacity: 0.92;
        }

        .register-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #message {
            margin: 15px 0;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
            text-align: center;
        }

        .links {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #f0e4ea;
            text-align: center;
            line-height: 2.2;
            font-size: 14px;
        }

        .links a {
            color: #b72e6d;
            font-weight: bold;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .separator {
            margin: 0 7px;
            color: #c8b8c2;
        }

        @media (max-width: 450px) {
            .register-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="register-box">
        <div class="logo">🎁 GiftMate</div>
        <p class="subtitle">Thoughtful gifting, made simple.</p>

        <h2>User Registration</h2>
        <p class="intro">Create your account to discover thoughtful gifts.</p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                required
                autocomplete="name"
                placeholder="Enter your full name"
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                placeholder="Enter your email address"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                maxlength="72"
                required
                autocomplete="new-password"
                placeholder="Create a password"
            >

            <button type="submit" class="register-button" id="registerButton">
                Create Account
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <div class="links">
            Already have an account?
            <a href="/user-login.html">User Login</a>

            <br>

            Administrator?
            <a href="/admin-login.html">Admin Login</a>

            <br>

            <a href="/">← Back to GiftMate Home</a>
        </div>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const registerButton = document.getElementById("registerButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.textContent = "Creating your account...";
            registerButton.disabled = true;

            try {
                const response = await fetch("/api/auth/user-register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: document.getElementById("name").value.trim(),
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                message.textContent =
                    data.message || "Registration could not be completed.";

                if (response.ok && data.success) {
                    form.reset();
                    message.textContent =
                        "Registration successful! You can now log in.";

                    setTimeout(function () {
                        window.location.href = "/user-login.html";
                    }, 1500);
                }
            } catch (error) {
                message.textContent =
                    "Could not connect to GiftMate. Please check that the server is running.";
            } finally {
                registerButton.disabled = false;
            }
        });
    </script>

</body>
</html>
